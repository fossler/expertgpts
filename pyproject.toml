[project]
name = "expertgpts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.28.0",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit~=1.65.0",
    "tiktoken>=0.13.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
